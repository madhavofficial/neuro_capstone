name: Issue 2 evaluation tests

on:
  push:
    branches:
      - main
      - feature/issue-2-structure-only-eval
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Issue 2 focused tests
        run: |
          python -m unittest benchmark.test_structure_only_model benchmark.test_batch_feature_export -v
      - name: Run repository test suite
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
